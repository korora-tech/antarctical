name: Release

# Push a tag like v0.2.0 to publish a release. The tag must match the version in Cargo.toml
# and have a section in CHANGELOG.md. Run manually (workflow_dispatch) to build and upload
# the artifact without publishing, to test the pipeline.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64 tarball
    # Oldest glibc we are willing to support; the binary links the system's fontconfig,
    # freetype, xcb and xkbcommon, and dlopens Vulkan and Wayland at runtime.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Resolve version
        id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Extract release notes
        run: |
          version='${{ steps.v.outputs.version }}'
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ "${GITHUB_REF_TYPE}" = tag ] && ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig-dev libfreetype-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev libssl-dev clang
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          version='${{ steps.v.outputs.version }}'
          name="antarctical-$version-x86_64-linux"
          mkdir -p "dist/$name"
          install -Dm755 target/release/antarctical "dist/$name/antarctical"
          install -Dm644 LICENSE "dist/$name/LICENSE"
          install -Dm644 README.md "dist/$name/README.md"
          install -Dm644 data/korora.tech.Antarctical.desktop "dist/$name/share/applications/korora.tech.Antarctical.desktop"
          install -Dm644 data/branding/antarctical-app-icon.svg "dist/$name/share/icons/hicolor/scalable/apps/korora.tech.Antarctical.svg"
          install -Dm644 data/branding/antarctical-app-icon.png "dist/$name/share/icons/hicolor/512x512/apps/korora.tech.Antarctical.png"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.sha256
            RELEASE_NOTES.md

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/*.tar.gz dist/*.sha256
